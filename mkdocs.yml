site_name: Midas
site_description: Portable AI product-development harness for coding agents (not Intel MiDaS depth estimation) — idea to shipped code in 9 audited phases.
site_url: https://okuzpe.github.io/midas-harness
repo_url: https://github.com/okuzpe/midas-harness
repo_name: okuzpe/midas-harness
edit_uri: edit/main/docs/

# TaskPilot fixture is a full Midas install — not MkDocs pages.
exclude_docs: |
  research/taskpilot/**
  product/sprints/**

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Methodology: methodology.md
  - Context & files: context-hierarchy.md
  - Repository Architecture: repository-architecture.md
  - Skills Reference: skills.md
  - Skill Flows: skill-flows.md
  - Skill quality gate: skill-quality-gate.md
  - Precommit gate (engine): precommit-gate.md
  - Contributor quickstart: contributing-quickstart.md
  - Engine dogfood: dogfood.md
  - Research fixtures: research/README.md
  - Engine dogfood product: product/README.md
  - Agents & Models: agents-and-models.md
  - FAQ: faq.md
  - Comparisons (community):
    - "gstack comparison": gstack-comparison.md
    - "muninn-harness comparison": muninn-comparison.md
  - Decisions (ADR):
    - "ADR-001 — Install layout (historical)": adr/ADR-001-install-layout.md
    - "ADR-002 — Code-intelligence MCP": adr/ADR-002-code-intelligence-mcp.md
    - "ADR-003 — Project memory model": adr/ADR-003-project-memory-model.md
    - "ADR-004 — Audit skill surface": adr/ADR-004-audit-skill-surface.md
    - "ADR-005 — AGENTS.md generation": adr/ADR-005-agents-md-generation.md
    - "ADR-006 — Hub layout (historical)": adr/ADR-006-hub-layout.md
    - "ADR-007 — Canonical .harness layout": adr/ADR-007-canonical-harness-layout.md
    - "ADR-008 — Thin root allowlist": adr/ADR-008-thin-root-allowlist.md
    - "ADR-009 — Optional autonomy control plane": adr/ADR-009-optional-autonomy-control-plane.md
    - "ADR-010 — Harness trace (observe)": adr/ADR-010-harness-trace-observe.md
    - "ADR-011 — Harness trace (installs)": adr/ADR-011-harness-trace-installs.md

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - admonition
  - toc:
      permalink: true
