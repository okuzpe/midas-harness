name: release-prep

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build and verify
        run: |
          node scripts/sync-version.mjs --check
          npm test
          npm run build
          node scripts/build-create.mjs
          node scripts/doctor.mjs
          pip install mkdocs-material==9.7.6
          mkdocs build --strict --site-dir _site

      - name: Prepare release notes
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = fs.readFileSync('harness/VERSION', 'utf8').trim();
          const text = fs.readFileSync('CHANGELOG.md', 'utf8');
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const re = new RegExp(`^## \\[${escaped}\\][\\s\\S]*?(?=\\n## \\[|\\n\\[Unreleased\\]:)`, 'm');
          const match = text.match(re);
          const notes = match
            ? match[0]
            : `# ${version}\n\n(No CHANGELOG section found for ${version}; see CHANGELOG.md.)\n`;
          fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/release-notes.md', notes);
          NODE

      - name: Pack tarball
        run: npm pack

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-prep
          path: |
            release-notes.md
            *.tgz
            _site/

  release-manifest:
    # Publish the stable channel hash for this tag so installs on `stable` see the release (ADR-016).
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'okuzpe/midas-harness'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-manifest-stable
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Publish stable channel manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: node scripts/publish-release-manifest.mjs --channel=stable --ref="$TAG" --commit="$GITHUB_SHA"
