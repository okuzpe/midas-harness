name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["16.20.2", "20", "24"]
    steps:
      # docs: GitHub Actions security hardening via docs.github.com (2026-06-27).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Structural test suite
        run: node scripts/test.mjs

      - name: Full align ladder (engine propagation)
        run: npm run align

      - name: Generated adapters in sync with source
        run: node scripts/doctor.mjs

      - name: Gate records consistent with state (taskpilot example)
        run: node scripts/doctor.mjs --strict --gates-only examples/taskpilot

      - name: Plugin tree in sync with .claude/
        run: |
          node scripts/build-plugin.mjs
          git diff --exit-code -- plugins .claude-plugin \
            || (echo "::error::plugins/ is stale — run 'node scripts/build-plugin.mjs' and commit" && exit 1)

      - name: create-midas template in sync with source
        run: |
          node scripts/build-create.mjs
          git diff --exit-code -- create-midas/template \
            || (echo "::error::create-midas/template is stale — run 'node scripts/build-create.mjs' and commit" && exit 1)

      - name: Installer smoke test (hub default)
        run: |
          node create-midas/index.mjs /tmp/midas-smoke
          test -f /tmp/midas-smoke/AGENTS.md
          test -f /tmp/midas-smoke/.mcp.json
          test -f /tmp/midas-smoke/CLAUDE.md
          test -f /tmp/midas-smoke/GEMINI.md
          test -d /tmp/midas-smoke/.claude/skills
          test -f /tmp/midas-smoke/.midas/state.yaml
          test -d /tmp/midas-smoke/.midas/product
          node /tmp/midas-smoke/.midas/scripts/doctor.mjs

      - name: Diagnose smoke test (read-only CLI)
        run: |
          tmp=$(mktemp -d)
          rmdir "$tmp"
          set +e
          node create-midas/index.mjs --diagnose "$tmp" >/tmp/midas-diagnose.out
          code=$?
          set -e
          test "$code" -eq 1
          grep -q "Status: not_installed" /tmp/midas-diagnose.out
          test ! -e "$tmp"
          node create-midas/index.mjs --diagnose /tmp/midas-smoke | grep -q "Status:"

      - name: Update smoke test
        run: |
          node create-midas/index.mjs /tmp/midas-update-smoke
          node create-midas/index.mjs --update /tmp/midas-update-smoke
          node /tmp/midas-update-smoke/.midas/scripts/doctor.mjs

      - name: Compact layout smoke test
        run: |
          node create-midas/index.mjs --layout=compact /tmp/midas-compact-smoke
          test -f /tmp/midas-compact-smoke/.midas/state.yaml
          test -d /tmp/midas-compact-smoke/.midas/engine
          test -d /tmp/midas-compact-smoke/product
          test -f /tmp/midas-compact-smoke/.midas/scripts/doctor.mjs
          node /tmp/midas-compact-smoke/.midas/scripts/doctor.mjs

      - name: Hub layout explicit smoke test
        run: |
          node create-midas/index.mjs --layout=hub /tmp/midas-hub-smoke
          test -f /tmp/midas-hub-smoke/.midas/state.yaml
          test -d /tmp/midas-hub-smoke/.midas/product
          ! test -d /tmp/midas-hub-smoke/product
          node /tmp/midas-hub-smoke/.midas/scripts/doctor.mjs

      - name: npm pack dry-run
        run: npm pack --dry-run 2>&1 | grep -q create-midas

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Installer smoke (Windows)
        run: |
          node create-midas/index.mjs $env:RUNNER_TEMP\midas-win-smoke
          node $env:RUNNER_TEMP\midas-win-smoke\.midas\scripts\doctor.mjs
        shell: pwsh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build docs site
        run: |
          pip install mkdocs-material==9.7.6
          mkdocs build --strict
