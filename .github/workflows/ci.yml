name: CI

on:
  push:
    # The release-manifest job pushes to `releases`; ignoring it here keeps CI from re-triggering itself.
    branches-ignore: [releases]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      # docs: GitHub Actions security hardening via docs.github.com (2026-06-27).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Structural test suite
        run: node scripts/test.mjs

      - name: Full align ladder (engine propagation)
        run: npm run align

      - name: Generated adapters in sync with source
        run: node scripts/doctor.mjs

      - name: Gate records (product-closed fixture)
        run: node scripts/doctor.mjs --strict --gates-only scripts/fixtures/product-closed

      - name: Plugin tree in sync with .claude/
        run: |
          node scripts/build-plugin.mjs
          git diff --exit-code -- harness/plugins harness/.claude-plugin \
            || (echo "::error::harness/plugins/ is stale — run 'node scripts/build-plugin.mjs' and commit" && exit 1)

      - name: create-midas template in sync with source
        run: |
          node scripts/build-create.mjs
          git diff --exit-code -- cli/template \
            || (echo "::error::cli/template is stale — run 'node scripts/build-create.mjs' and commit" && exit 1)

      - name: Installer smoke test (user shape — cursor-only thin root)
        run: |
          # Primary product shape (ADR-008): default tools=[cursor]
          set +e
          node cli/index.mjs --tools=cursor /tmp/midas-smoke
          install_code=$?
          set -e
          echo "installer_exit=$install_code"
          test "$install_code" -eq 0
          test -f /tmp/midas-smoke/AGENTS.md || { echo "::error::missing AGENTS.md"; exit 1; }
          test -f /tmp/midas-smoke/.mcp.json || { echo "::error::missing .mcp.json"; exit 1; }
          test -f /tmp/midas-smoke/.cursor/rules/00-midas.mdc || { echo "::error::missing cursor adapter"; exit 1; }
          test -f /tmp/midas-smoke/.cursor/rules/01-midas-checks.mdc || { echo "::error::missing cursor checks adapter"; exit 1; }
          test -d /tmp/midas-smoke/.cursor/skills || { echo "::error::missing .cursor/skills"; exit 1; }
          test -f /tmp/midas-smoke/.harness/state.yaml || { echo "::error::missing state.yaml"; exit 1; }
          test -d /tmp/midas-smoke/.harness/product || { echo "::error::missing product dir"; exit 1; }
          grep -q 'tools: \[cursor\]' /tmp/midas-smoke/.harness/state.yaml || { echo "::error::tools not [cursor]"; exit 1; }
          test ! -e /tmp/midas-smoke/.claude || { echo "::error::leftover .claude"; find /tmp/midas-smoke/.claude | head; exit 1; }
          test ! -e /tmp/midas-smoke/.agents || { echo "::error::leftover .agents"; find /tmp/midas-smoke/.agents | head; exit 1; }
          test ! -e /tmp/midas-smoke/.windsurf || { echo "::error::leftover .windsurf"; find /tmp/midas-smoke/.windsurf | head; exit 1; }
          test ! -e /tmp/midas-smoke/GEMINI.md || { echo "::error::leftover GEMINI.md"; exit 1; }
          node /tmp/midas-smoke/.harness/scripts/doctor.mjs --strict /tmp/midas-smoke

      - name: Installer smoke test (multi-host — non-default coverage)
        run: |
          node cli/index.mjs --tools=claude-code,cursor,windsurf,gemini /tmp/midas-smoke-all
          test -f /tmp/midas-smoke-all/.claude/CLAUDE.md
          test -f /tmp/midas-smoke-all/.cursor/rules/00-midas.mdc
          test -f /tmp/midas-smoke-all/.cursor/rules/01-midas-checks.mdc
          test -f /tmp/midas-smoke-all/.harness/.windsurf/rules/00-midas.md
          test -f /tmp/midas-smoke-all/.harness/.windsurf/rules/01-midas-checks.md
          test -f /tmp/midas-smoke-all/GEMINI.md
          test -d /tmp/midas-smoke-all/.claude/skills
          node /tmp/midas-smoke-all/.harness/scripts/doctor.mjs --strict /tmp/midas-smoke-all

      - name: Diagnose smoke test (read-only CLI)
        run: |
          tmp=$(mktemp -d)
          rmdir "$tmp"
          set +e
          node cli/index.mjs --diagnose "$tmp" >/tmp/midas-diagnose.out
          code=$?
          set -e
          test "$code" -eq 1
          grep -q "Status: not_installed" /tmp/midas-diagnose.out
          test ! -e "$tmp"
          node cli/index.mjs --diagnose /tmp/midas-smoke | grep -q "Status:"

      - name: Update smoke test (preserves cursor-only tools)
        run: |
          node cli/index.mjs --tools=cursor /tmp/midas-update-smoke
          node cli/index.mjs update /tmp/midas-update-smoke
          grep -q 'tools: \[cursor\]' /tmp/midas-update-smoke/.harness/state.yaml
          test -d /tmp/midas-update-smoke/.cursor/skills
          test ! -e /tmp/midas-update-smoke/.claude
          node /tmp/midas-update-smoke/.harness/scripts/doctor.mjs --strict /tmp/midas-update-smoke

      - name: Update reconciliation smoke test (channel check + prune + conflict)
        run: |
          node scripts/release-manifest.mjs --channel=stable --commit="$GITHUB_SHA" -o=/tmp/midas-release.json
          # Nothing new: the installed tree hashes to exactly what we just published.
          # --check uses 0/1/2; bash -e would treat 1 (available) as a step failure.
          set +e
          node cli/index.mjs update --check --manifest-file=/tmp/midas-release.json /tmp/midas-update-smoke
          check_code=$?
          set -e
          echo "update --check exit=$check_code (want 0 = current)"
          test "$check_code" -eq 0
          # A file the bundle no longer ships must be deleted, an edited vendor file saved aside,
          # and user-owned rules left alone.
          echo '# dropped by a later bundle' > /tmp/midas-update-smoke/.harness/engine/dropped.md
          echo '# local rule' > /tmp/midas-update-smoke/.harness/rules/mine.md
          echo 'local vendor edit' >> /tmp/midas-update-smoke/.harness/engine/conventions.md
          echo 'untracked note' > /tmp/midas-update-smoke/.harness/engine/stray.md
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const root = "/tmp/midas-update-smoke";
            const p = root + "/.harness/manifest.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            const rel = ".harness/engine/dropped.md";
            const sha = crypto.createHash("sha256").update(fs.readFileSync(root + "/" + rel)).digest("hex");
            m.files.push({ path: rel, role: "vendor", sha256: sha, size: 1 });
            fs.writeFileSync(p, JSON.stringify(m, null, 2));
          '
          echo 'I edited this before it was dropped' >> /tmp/midas-update-smoke/.harness/engine/dropped.md
          node cli/index.mjs update --yes /tmp/midas-update-smoke
          test ! -e /tmp/midas-update-smoke/.harness/engine/dropped.md
          test -f /tmp/midas-update-smoke/.harness/engine/stray.md
          test -f /tmp/midas-update-smoke/.harness/rules/mine.md
          grep -q 'local vendor edit' /tmp/midas-update-smoke/.harness/rules/mine.md && exit 1 || true
          ! grep -q 'local vendor edit' /tmp/midas-update-smoke/.harness/engine/conventions.md
          find /tmp/midas-update-smoke/.harness/conflicts -name '*.midas-conflict' | grep -q conventions
          find /tmp/midas-update-smoke/.harness/conflicts -name 'dropped.md.midas-conflict' | grep -q dropped
          rm -rf /tmp/midas-update-smoke/.harness/conflicts
          node /tmp/midas-update-smoke/.harness/scripts/doctor.mjs --strict /tmp/midas-update-smoke

      - name: npm pack dry-run
        run: npm pack --dry-run 2>&1 | grep -q cli

  release-manifest:
    # Publish the content hash of this build so installed projects can discover it with
    # `midas update --check` without downloading the bundle (ADR-016).
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'okuzpe/midas-harness'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-manifest-edge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Publish edge channel manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/publish-release-manifest.mjs --channel=edge --commit="$GITHUB_SHA"

  host-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        host: [cursor, claude-code, windsurf, gemini, codex, copilot]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Clean install and update for host
        run: node scripts/ci-install-smoke.mjs ${{ matrix.host }}
      - name: Windows migration and rollback fixtures
        if: matrix.os == 'windows-latest' && matrix.host == 'codex'
        run: node scripts/test.mjs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build docs site
        run: |
          pip install mkdocs-material==9.7.6
          mkdocs build --strict
