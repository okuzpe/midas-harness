# Canonical stage → command + recall paths (single source of truth).
# Consumed by: scripts/stage-command-table.mjs, scripts/bundle.mjs (recall profile),
# .claude/skills/midas-status, .claude/skills/midas-recall.
# After edits: npm run align (copies to create-midas/template via build-create).

stages:
  idea_intake:
    command: /idea-intake
    recall:
      - "{product}/idea.md"
  contextualize:
    command: /contextualize
    recall:
      - "{product}/idea.md"
      - "{product}/open-questions.md"
  market_research:
    command: /market-research
    note: Optional host deep-research skill or web/Context7 when absent — not shipped in Midas engine.
    recall:
      - "{product}/idea.md"
      - "{product}/market.md"
  business_case:
    command: /business-plan
    note: Needs human sign-off.
    recall:
      - "{product}/market.md"
      - "{product}/business-plan.md"
  tech_architecture:
    command: /choose-architecture
    recall:
      - "{product}/business-plan.md"
      - "{product}/architecture.md"
      - "{product}/adr"
  architecture_rules:
    command: /define-conventions
    recall:
      - "{product}/architecture.md"
      - "{product}/design-direction.md"
      - "{product}/design-system.md"
  sprint_planning:
    command: /plan-sprints
    recall:
      - "{product}/roadmap.md"
      - "{product}/business-plan.md"
      - "{product}/design-direction.md"
  sprint_execution:
    command: /start-sprint
    command_when_done: /close-sprint
    verify_ui: /midas-verify
    redesign_ui: /midas-design
    qa_adhoc: /midas-qa
    recall:
      - "{product}/features.json"
      - "{product}/design-direction.md"
      - "{runs}/verifications"
      - "{runs}/design"
      - "{runs}/sprints"
  shipped:
    command: null
    recall:
